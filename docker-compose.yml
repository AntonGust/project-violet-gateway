services:

  # === FILTER GATEWAY ===
  filter_gateway:
    build: ./filter_gateway
    restart: always
    ports:
      - "22:2222"
    networks:
      honeypot_external:
        ipv4_address: 172.20.99.2
      net_entry:
        ipv4_address: 172.20.0.2
    volumes:
      - ${LOG_DIR:-./data}/filter:/data
    environment:
      - COWRIE_HOP1_HOST=172.20.0.10
      - COWRIE_HOP1_PORT=2222
      - MAX_CONN_RATE=${MAX_CONN_RATE:-10}
      - MAX_CONCURRENT=${MAX_CONCURRENT:-3}
      - SILENT_DROP_TIMEOUT=${SILENT_DROP_TIMEOUT:-30}
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # === SESSION ANALYZER ===
  session_analyzer:
    build: ./session_analyzer
    restart: always
    networks:
      net_entry:
        ipv4_address: 172.20.0.5
    volumes:
      - ${LOG_DIR:-./data}/filter:/data
      - ${LOG_DIR:-./data}/cowrie_hop1:/cowrie_logs/hop1:ro
      - ${LOG_DIR:-./data}/cowrie_hop2:/cowrie_logs/hop2:ro
      - ${LOG_DIR:-./data}/cowrie_hop3:/cowrie_logs/hop3:ro
    environment:
      - LEARN_THRESHOLD=${LEARN_THRESHOLD:-5}
      - BRUTE_FORCE_THRESHOLD=${BRUTE_FORCE_THRESHOLD:-20}
      - RAPID_DISCONNECT_SEC=${RAPID_DISCONNECT_SEC:-5}
      - SPIKE_WINDOW_MIN=${SPIKE_WINDOW_MIN:-10}
      - SPIKE_MULTIPLIER=${SPIKE_MULTIPLIER:-5}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    mem_limit: 256m
    cpus: 0.5
    read_only: false
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # === BLOCKLIST UPDATER ===
  blocklist_updater:
    build: ./blocklist_updater
    restart: always
    networks:
      honeypot_external:
        ipv4_address: 172.20.99.11
    volumes:
      - ${LOG_DIR:-./data}/filter:/data
    environment:
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - CONFIDENCE_MINIMUM=${CONFIDENCE_MINIMUM:-90}
    mem_limit: 128m
    cpus: 0.25
    read_only: false
    tmpfs:
      - /tmp
      - /var/run
    security_opt:
      - no-new-privileges:true

  # === LLM PROXY ===
  # Reverse proxy that isolates the API key from honeypot containers.
  # Cowrie containers talk to this over net_llm (internal).
  # Only this container can reach the LLM backend (cloud API or host-local model).
  llm_proxy:
    build: ./llm_proxy
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      honeypot_external:
        ipv4_address: 172.20.99.10
      net_llm:
        ipv4_address: 172.20.10.2
    environment:
      - LLM_BACKEND=${LLM_BACKEND:-https://llm.aiqu.ai}
      - LLM_API_KEY=${LLM_API_KEY:-}
    mem_limit: 64m
    cpus: 0.25
    read_only: false
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    volumes:
      # World-writable tmpfs so the unprivileged nginx user can land
      # the envsubst-rendered config from /etc/nginx/templates/.
      - type: tmpfs
        target: /etc/nginx/conf.d
        tmpfs:
          mode: 01777
    security_opt:
      - no-new-privileges:true

  # === COWRIE HOP 1 (Entry Point) ===
  cowrie_hop1:
    build: ../Project-Violet-2.0/Cowrie/cowrie-src
    restart: always
    environment:
      - COWRIE_HYBRID_LLM_API_KEY=proxy-no-key-needed
      - COWRIE_HYBRID_LLM_ENABLED=true
      - COWRIE_HYBRID_LLM_HOST=http://172.20.10.2:8080
      - COWRIE_HYBRID_LLM_MODEL=${HP_MODEL:-gpt-oss-120b}
      - COWRIE_HYBRID_LLM_PATH=/v1/chat/completions
      - HONEYNET_MODE=true
      - COWRIE_DB_HOST=172.20.0.4
      - COWRIE_DB_ENGINE=mysql
      - COWRIE_DB_PORT=3306
      - COWRIE_DB_ROOT_PASSWORD=${COWRIE_DB_ROOT_PASSWORD_HOP1}
      - COWRIE_DB_NAME=wordpress_prod
      - COWRIE_DB_USER=wp_admin
      - COWRIE_DB_PASSWORD=${COWRIE_DB_PASSWORD_HOP1}
    volumes:
      - ../Project-Violet-2.0/cowrie_config_hop1/etc:/cowrie/cowrie-git/etc
      - ../Project-Violet-2.0/cowrie_config_hop1/honeyfs:/cowrie/cowrie-git/honeyfs
      - ../Project-Violet-2.0/cowrie_config_hop1/share:/cowrie/cowrie-git/share/cowrie
      - ${LOG_DIR:-./data}/cowrie_hop1:/cowrie/cowrie-git/var
    networks:
      net_entry:
        ipv4_address: 172.20.0.10
      net_hop1:
        ipv4_address: 172.20.1.10
      net_llm:
        ipv4_address: 172.20.10.10
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

  # === COWRIE HOP 2 ===
  cowrie_hop2:
    build: ../Project-Violet-2.0/Cowrie/cowrie-src
    restart: always
    environment:
      - COWRIE_HYBRID_LLM_API_KEY=proxy-no-key-needed
      - COWRIE_HYBRID_LLM_ENABLED=true
      - COWRIE_HYBRID_LLM_HOST=http://172.20.10.2:8080
      - COWRIE_HYBRID_LLM_MODEL=${HP_MODEL:-gpt-oss-120b}
      - COWRIE_HYBRID_LLM_PATH=/v1/chat/completions
      - HONEYNET_MODE=true
      - COWRIE_DB_HOST=172.20.1.22
      - COWRIE_DB_ENGINE=postgresql
      - COWRIE_DB_PORT=5432
      - COWRIE_DB_ROOT_PASSWORD=${HONEYPOT_DB_PASSWORD}
      - COWRIE_DB_NAME=postgres
      - COWRIE_DB_USER=postgres
      - COWRIE_DB_PASSWORD=${HONEYPOT_DB_PASSWORD}
    volumes:
      - ../Project-Violet-2.0/cowrie_config_hop2/etc:/cowrie/cowrie-git/etc
      - ../Project-Violet-2.0/cowrie_config_hop2/honeyfs:/cowrie/cowrie-git/honeyfs
      - ../Project-Violet-2.0/cowrie_config_hop2/share:/cowrie/cowrie-git/share/cowrie
      - ${LOG_DIR:-./data}/cowrie_hop2:/cowrie/cowrie-git/var
    networks:
      net_hop1:
        ipv4_address: 172.20.1.11
      net_hop2:
        ipv4_address: 172.20.2.11
      net_llm:
        ipv4_address: 172.20.10.11
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

  # === COWRIE HOP 3 ===
  cowrie_hop3:
    build: ../Project-Violet-2.0/Cowrie/cowrie-src
    restart: always
    environment:
      - COWRIE_HYBRID_LLM_API_KEY=proxy-no-key-needed
      - COWRIE_HYBRID_LLM_ENABLED=true
      - COWRIE_HYBRID_LLM_HOST=http://172.20.10.2:8080
      - COWRIE_HYBRID_LLM_MODEL=${HP_MODEL:-gpt-oss-120b}
      - COWRIE_HYBRID_LLM_PATH=/v1/chat/completions
      - HONEYNET_MODE=true
      - COWRIE_DB_HOST=
      - COWRIE_DB_ENGINE=
      - COWRIE_DB_PORT=
      - COWRIE_DB_NAME=
      - COWRIE_DB_USER=
      - COWRIE_DB_PASSWORD=
      - COWRIE_DB_ROOT_PASSWORD=
    volumes:
      - ../Project-Violet-2.0/cowrie_config_hop3/etc:/cowrie/cowrie-git/etc
      - ../Project-Violet-2.0/cowrie_config_hop3/honeyfs:/cowrie/cowrie-git/honeyfs
      - ../Project-Violet-2.0/cowrie_config_hop3/share:/cowrie/cowrie-git/share/cowrie
      - ${LOG_DIR:-./data}/cowrie_hop3:/cowrie/cowrie-git/var
    networks:
      net_hop2:
        ipv4_address: 172.20.2.12
      net_llm:
        ipv4_address: 172.20.10.12
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

  # === DECOY DATABASE HOP 1 (MySQL — wordpress server) ===
  honeypot_db_hop1:
    image: mysql:8.0
    restart: "no"
    volumes:
      - ../Project-Violet-2.0/cowrie_config_hop1/db_init:/docker-entrypoint-initdb.d:ro
    networks:
      net_entry:
        ipv4_address: 172.20.0.4
    environment:
      MYSQL_ROOT_PASSWORD: ${COWRIE_DB_ROOT_PASSWORD_HOP1}
      MYSQL_DATABASE: wordpress_prod
      MYSQL_USER: wp_admin
      MYSQL_PASSWORD: ${COWRIE_DB_PASSWORD_HOP1}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 256m
    cpus: 0.5

  # === DECOY DATABASE HOP 2 (Postgres — database server) ===
  honeypot_db_hop2:
    image: postgres:16
    restart: "no"
    volumes:
      - ../Project-Violet-2.0/cowrie_config_hop2/db_init:/docker-entrypoint-initdb.d:ro
    networks:
      net_hop1:
        ipv4_address: 172.20.1.22
    environment:
      POSTGRES_PASSWORD: ${HONEYPOT_DB_PASSWORD}
      POSTGRES_DB: app_production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 256m
    cpus: 0.5

  # === ATTACK THEATER ===
  # Kiosk display: replays Cowrie SSH sessions live and from archive.
  # Bind to LAN only; do NOT expose port 8080 to the internet.
  # Only starts with: docker compose --profile monitoring up
  attack_theater:
    profiles: [monitoring]
    build: ./attack_theater
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      net_entry:
        ipv4_address: 172.20.0.6
    volumes:
      - ${LOG_DIR:-./data}/cowrie_hop1:/cowrie_logs/hop1:ro
      - ${LOG_DIR:-./data}/cowrie_hop2:/cowrie_logs/hop2:ro
      - ${LOG_DIR:-./data}/cowrie_hop3:/cowrie_logs/hop3:ro
      - ${LOG_DIR:-./data}/theater:/data
      # To enable geo lookups: place GeoLite2-City.mmdb in ./data/theater/ (or $LOG_DIR/theater/)
      # No separate mount needed — /data is already mapped to that directory.
    environment:
      - DB_PATH=/data/theater.db
      - MMDB_PATH=/data/GeoLite2-City.mmdb
      - HOST=0.0.0.0
      - PORT=8080
      - THEATER_PASSWORD=${THEATER_PASSWORD:-}
    mem_limit: 256m
    cpus: 0.5
    read_only: false
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # === ANALYSIS AGENT ===
  # LangGraph pipeline that classifies and summarises interesting sessions.
  # Reads theater.db, calls the llm_proxy, writes markdown reports to /data/reports.
  # Only starts with: docker compose --profile monitoring up
  analysis_agent:
    profiles: [monitoring]
    build: ./analysis_agent
    restart: always
    depends_on:
      - llm_proxy
    networks:
      net_llm:
    volumes:
      - ${LOG_DIR:-./data}/theater:/theater_data:ro
      - ${LOG_DIR:-./data}/analysis:/data
    environment:
      - THEATER_DB_PATH=/theater_data/theater.db
      - ANALYSIS_DB_PATH=/data/analysis.db
      - LLM_BASE_URL=http://172.20.10.2:8080/v1
      - LLM_API_KEY=proxy-no-key-needed
      - LLM_MODEL=${AGENT_MODEL:-nemotron-3-super}
      - POLL_INTERVAL_SEC=${ANALYSIS_POLL_INTERVAL_SEC:-300}
    mem_limit: 256m
    cpus: 0.5
    read_only: false
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

networks:
  honeypot_external:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.99.0/24
  net_entry:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.0.0/24
  net_hop1:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.1.0/24
  net_hop2:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.2.0/24
  net_llm:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.10.0/24

volumes: {}
