[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "analysis_agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph==0.2.55",
    "openai>=1.0",
    "aiosqlite==0.20.0",
    "jinja2==3.1.4",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
]

[project.scripts]
analysis-agent = "agent.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"
