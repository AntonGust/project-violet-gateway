global
    log stdout format raw local0 info
    lua-load /usr/local/etc/haproxy/filter_check.lua
    user filter
    group filter

defaults
    mode tcp
    timeout connect 5s
    timeout client  300s
    timeout server  300s
    log global
    option tcplog

frontend ssh_in
    bind *:2222

    # --- Layer 1: HAProxy stick-table rate limiting (fast, in-memory) ---
    stick-table type ip size 100k expire 5m store conn_rate(1m),conn_cur
    tcp-request connection track-sc0 src

    # Silent reject if rate > MAX_CONN_RATE or concurrent > MAX_CONCURRENT
    tcp-request connection reject if { sc0_conn_rate gt ${MAX_CONN_RATE} }
    tcp-request connection reject if { sc0_conn_cur gt ${MAX_CONCURRENT} }

    # --- Layer 2: Lua filter check (blocklist + ban DB) ---
    tcp-request content lua.check_filter

    # Route based on filter decision
    use_backend blackhole if { var(txn.filter_decision) -m str DROP }

    default_backend cowrie_hop1

backend cowrie_hop1
    server hop1 ${COWRIE_HOP1_HOST}:${COWRIE_HOP1_PORT} check

backend blackhole
    # Silent drop: no server defined, connection hangs until timeout
    timeout server 30s
    timeout connect 5s
